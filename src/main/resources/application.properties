server.port=${SERVER_PORT:8080}
spring.application.name=pcms-backend

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PCMS;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Sa@123456Abc!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# ===== PCMS Application Properties =====
pcms.jwt.secret=9a61b8f5d1c2e3f4a5b6c7d8e9f0123456789abcdef0123456789abcdef01234
pcms.jwt.expiration-ms=86400000
pcms.cors.allowed-origins=http://localhost:5173,http://localhost:3000

pcms.seed.admin-username=admin
pcms.seed.admin-password=Admin@123
pcms.seed.admin-email=admin@pcms.com

# Section 4.1.6: Mail server configuration (Dev default / Fallback mock)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:pcms.notifications@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
